name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      runner: ${{ matrix.os }}
      command: |
        go test ./...
        CGO_ENABLED=0 go test ./...
        if [ "$RUNNER_OS" = Linux ]; then
          go test -race ./...
          go test -coverprofile=coverage.out ./...
          test -z "$(gofmt -l .)"
        fi
        go vet ./...
